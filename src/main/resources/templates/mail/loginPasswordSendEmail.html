<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="#{email.send-login-and-password.title}">User created</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" th:href="@{|${baseUrl}/favicon.ico|}" />
  </head>
  <body>
    <p th:text="#{email.send-login-and-password.greeting(${user.firstName})}">Dear</p>
    <p th:text="#{email.send-login-and-password.text1}">Welcome muxtoriyat:</p>
    <p th:text="#{email.send-login-and-password.login(${user.login})}"></p>
    <p th:text="#{email.send-login-and-password.password(${password})}"></p>
    <p>
      <span th:text="#{email.send-login-and-password.text2}">Regards, </span>
      <br />
      <em th:text="#{email.signature}">JHipster.</em>
    </p>
  </body>
</html>
