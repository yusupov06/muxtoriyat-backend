<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-reaction-heading" data-cy="ReactionCreateUpdateHeading" jhiTranslate="muxtoriyatApp.reaction.home.createOrEditLabel">
        Create or edit a Reaction
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="muxtoriyatApp.reaction.id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_deviceId" jhiTranslate="muxtoriyatApp.reaction.deviceId">Device Id</label>
          <input type="text" class="form-control" name="deviceId" id="field_deviceId" data-cy="deviceId" formControlName="deviceId" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_targetId" jhiTranslate="muxtoriyatApp.reaction.targetId">Target Id</label>
          <input type="number" class="form-control" name="targetId" id="field_targetId" data-cy="targetId" formControlName="targetId" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_reactionType" jhiTranslate="muxtoriyatApp.reaction.reactionType">Reaction Type</label>
          <select class="form-control" name="reactionType" formControlName="reactionType" id="field_reactionType" data-cy="reactionType">
            <option [ngValue]="null">{{ 'muxtoriyatApp.ReactionType.null' | translate }}</option>
            @for (reactionType of reactionTypeValues; track $index) {
              <option [value]="reactionType">{{ 'muxtoriyatApp.ReactionType.' + reactionType | translate }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
